<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Syndicate | Menu</title>

  <link rel="stylesheet" href="styles.css">

  <style>

    :root {
      --background-dark: #090909;
      --gold: #d9b438;
      --gold-light: #efcc54;
      --gold-dark: #7d651c;
      --text-light: #e6dfc9;
      --text-muted: #a59b80;

      --font-heading: "Cinzel", serif;
      --font-body: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      background: var(--background-dark);
      color: var(--text-light);

      font-family: var(--font-body);
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* ---------------- HEADER ---------------- */

    .site-header {
      height: 70px;

      display: flex;
      align-items: center;

      padding: 0 20px;

      border-bottom: 1px solid var(--gold-dark);
    }

    .logo-area img {
      height: 45px;
      width: auto;

      display: block;
    }


    /* ---------------- MENU CONTENT ---------------- */

    main {
      flex: 1;

      display: flex;
      justify-content: center;

      padding: 55px 20px 70px;
    }

    .menu-container {
      width: 100%;
      max-width: 620px;

      text-align: center;
    }

    .menu-title {
      font-family: var(--font-heading);

      color: var(--gold);

      font-size: 42px;
      font-weight: 400;

      letter-spacing: 3px;

      margin-bottom: 12px;
    }

    .menu-subtitle {
      color: var(--text-muted);

      font-size: 14px;

      margin-bottom: 40px;
    }


    /* ---------------- NAV BUTTONS ---------------- */

    .menu-links {
      display: flex;
      flex-direction: column;

      gap: 22px;

      align-items: center;
    }

    .menu-link {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      max-width: 360px;

      min-height: 68px;

      padding: 12px 24px;

      background:
        linear-gradient(
          to bottom,
          #b51414 0%,
          #8f0909 45%,
          #650505 100%
        );

      color: #ffd633;

      font-family: var(--font-heading);
      font-size: 17px;

      border: 2px solid #2a1a10;
      border-radius: 5px;

      box-shadow:
        0 0 0 2px #6a4a25,
        0 0 0 4px #120d09,
        inset 0 2px 0 rgba(255,255,255,0.18),
        inset 0 -2px 0 rgba(0,0,0,0.55),
        0 3px 5px rgba(0,0,0,0.75);

      text-shadow: 1px 1px 2px #000;

      transition:
        filter 0.1s ease,
        transform 0.1s ease;
    }

    .menu-link:hover {
      filter: brightness(1.15);
    }

    .menu-link:active {
      transform: translateY(2px);
    }


    /* ---------------- DIVIDER ---------------- */

    .divider-section {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 18px;

      max-width: 900px;

      margin: 0 auto;

      padding: 20px 30px;
    }

    .divider-line {
      height: 1px;

      flex: 1;

      background: var(--gold-dark);
    }

    .divider-text {
      font-family: var(--font-heading);

      color: var(--gold-dark);

      font-size: 14px;

      letter-spacing: 2px;

      white-space: nowrap;
    }


    /* ---------------- FOOTER ---------------- */

    .site-footer {
      display: flex;

      justify-content: center;
      align-items: center;

      padding: 15px 20px 35px;
    }

    .footer-logo img {
      height: 55px;
      width: auto;

      display: block;
    }


    /* ---------------- MOBILE ---------------- */

    @media (max-width: 650px) {

      .site-header {
        height: 60px;
        padding: 0 16px;
      }

      .logo-area img {
        height: 36px;
      }

      main {
        padding: 40px 18px 55px;
      }

      .menu-title {
        font-size: 34px;
      }

      .menu-subtitle {
        font-size: 13px;
      }

      .menu-link {
        max-width: 300px;
        min-height: 62px;

        font-size: 15px;
      }

      .divider-text {
        font-size: 11px;
      }

      .footer-logo img {
        height: 45px;
      }

    }

  </style>
</head>


<body>


  <!-- HEADER -->

  <header class="site-header">

    <a
      href="index.html"
      class="logo-area"
    >
      <img
        src="images/HeaderLogo.png"
        alt="The Syndicate"
      >
    </a>

  </header>



  <!-- MENU -->

  <main>

    <section class="menu-container">

      <h1 class="menu-title">
        MENU
      </h1>

      <p class="menu-subtitle">
        Navigate The Syndicate
      </p>


      <nav class="menu-links">

        <a
          href="index.html"
          class="menu-link"
        >
          HOME
        </a>


        <a
          href="guild.html"
          class="menu-link"
        >
          OUR GUILD
        </a>


        <a
          href="raids.html"
          class="menu-link"
        >
          RAID HUB
        </a>


        <a
          href="calendar.html"
          class="menu-link"
        >
          CALENDAR
        </a>


        <a
          href="resources.html"
          class="menu-link"
        >
          RESOURCES
        </a>

      </nav>

    </section>

  </main>



  <!-- FOOTER DIVIDER -->

  <section class="divider-section">

    <div class="divider-line"></div>

    <div class="divider-text">
      ◆ THIS IS THE WAY. ◆
    </div>

    <div class="divider-line"></div>

  </section>



  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="footer-logo">

      <img
        src="images/HeaderLogo.png"
        alt="The Syndicate"
      >

    </div>

  </footer>


</body>

</html>
