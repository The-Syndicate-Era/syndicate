<!DOCTYPE html>
<html lang="en" class="syn-access-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add-ons | The Syndicate</title>
<link rel="stylesheet" href="../settings/styles.css">
  <!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

<!-- Shared Supabase connection -->
<script src="settings/supabase-config.js" defer></script>

<!-- Discord authentication -->
<script src="settings/auth.js" defer></script>

<!-- Syndicate membership protection -->
<script src="settings/page-guard.js" defer></script>

<!-- Existing website scripts -->
<script src="settings/font-setting.js" defer></script>
<script src="settings/menu.js" defer></script>
<script src="settings/site-layout.js" defer></script>
<style>
/* Page-only layout. Shared branding, header, footer and root font-size live in settings/. */
.addons-page { --addon-outline: #6c5520; --addon-gold: var(--gold, #d4af37); --addon-copy: #d8d0bb; max-width: 1510px; margin: 0 auto; padding: 2rem clamp(1rem,3.2vw,3rem) 5rem; color: var(--addon-copy); }
.addons-page a { text-decoration: none; }
.addons-intro { margin: 0 0 2rem; max-width: 950px; }
.addons-intro h1 { font: 500 clamp(2rem,4vw,3.1rem)/1.15 var(--font-heading, Cinzel,serif); color: var(--addon-gold); margin: 0 0 0.8rem; }
.addons-intro p { font-size: 1rem; line-height: 1.65; margin: 0 0 1rem; }
.addons-layout { display: grid; grid-template-columns: minmax(220px, 28fr) minmax(0, 72fr); gap: clamp(1.25rem,3vw,2.8rem); align-items: start; }
.addons-directory { min-width: 0; grid-column:2; grid-row:1; }
.addons-image { width:100%; min-width:0; grid-column:1; grid-row:1; position:sticky; top:1.5rem; align-self:start; }
.addons-image img { display:block; width:100%; height:auto; max-height: calc(100dvh - 3rem); object-fit: contain; object-position: top; border: 1px solid var(--addon-outline); background:#0b0a08; }
.filters { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(160px,1fr) minmax(140px,0.85fr); gap: 0.7rem; margin-bottom: 1rem; }
.filters input, .filters select { width:100%; min-width:0; min-height:2.75rem; padding:0.55rem 0.75rem; border:1px solid var(--addon-outline); border-radius: 4px; background:#110f0c; color:#f0e7d3; font:inherit; font-size:0.9rem; }
.filters input::placeholder {color:#ada18b;opacity:1}
.addon-tools { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; margin-bottom:0.85rem; color:#bcb19a; font-size:0.85rem; }
.addon-tools button { color:var(--addon-gold); background:none; border:1px solid var(--addon-outline); padding:0.4rem 0.8rem; border-radius:3px; font:inherit; cursor:pointer; }
.addon-tools button:hover {background:#201b11}
.addon-list {display:grid; gap:0.55rem; }
.addon-entry[hidden] {display:none!important}
.addon-entry { background:linear-gradient(90deg,rgba(212,175,55,.035),transparent 32%),#11100d; border:1px solid #504225; border-radius:4px; }
.addon-entry:has(.addon-toggle[aria-expanded="true"]) {border-color:#b49542;}
.addon-heading {margin:0; font-size:inherit; }
.addon-toggle {display:flex; justify-content:space-between; align-items:center; gap:1rem; width:100%; padding:0.72rem 1rem; background:transparent; color:inherit; border:0; text-align:left; cursor:pointer; font:inherit; }
.addon-toggle:hover {background:rgba(212,175,55,.05)}
.addon-label {display:flex; flex-direction:column; gap:0.35rem; min-width:0;}
.addon-name {font:500 1rem/1.4 var(--font-heading, Cinzel,serif); color:var(--addon-gold); overflow-wrap:anywhere; }
.addon-meta {display:flex; flex-wrap:wrap; align-items:center; gap:0.35rem 0.65rem;}
.addon-category {font-size:0.73rem; color:#c3b596; text-transform:uppercase;letter-spacing:.04em;}
.tag {border:1px solid #6e5928;color:#cfb86f; padding:0.14rem 0.38rem; font-size:0.66rem;letter-spacing:.035em; text-transform:uppercase;}
.tag.required {border-color:#953633;color:#ed988e} .tag.guild {border-color:#92743b;color:#e5c36f} .tag.pvp{border-color:#69498b;color:#b7a1e0} .tag.dependency{border-color:#3d6f85;color:#9fd1e7}
.addon-chevron {color:var(--addon-gold);font-size:1.55rem; flex-shrink:0;line-height:1;transition:transform .2s ease;}
.addon-toggle[aria-expanded="true"] .addon-chevron {transform:rotate(180deg)}
.addon-panel {padding:0.1rem 1rem 1.1rem; border-top:1px solid #3f351e; }
.addon-panel[hidden] {display:none!important}
.addon-panel p {font-size:0.94rem; line-height:1.65; margin:0.8rem 0 1.2rem;color:#e0d6c4;}
.syndicate-button {display:inline-flex; align-items:center;justify-content:center;min-height:2.65rem;padding:0.55rem 1rem; border:2px solid #372211;border-radius:5px;box-shadow:0 0 0 2px #755626,inset 0 1px #ffffff30,0 3px 8px #000a; background:linear-gradient(#b51414,#8f0909 55%,#650505);color:#ffda5c;font:600 0.78rem/1.2 var(--font-heading,Cinzel,serif);text-align:center;}
.syndicate-button:hover {filter:brightness(1.15)}
.no-results {display:none; padding:1.5rem; border:1px solid var(--addon-outline); text-align:center;color:#d3c4a3;}
/* Make use of sitewide root font scaling instead of fixed pixel text. */
@media(max-width:1080px){.addons-layout{grid-template-columns:minmax(210px, 1fr) minmax(0, 1.65fr)} .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media(max-width:768px){.addons-page{padding:1.3rem 1rem 3rem}.addons-layout{grid-template-columns:1fr}.addons-image{grid-column:1;grid-row:1;position:static;display:flex;justify-content:center}.addons-image picture{display:block;width:min(100%,280px)}.addons-image img{max-height:280px;aspect-ratio:1/1;object-fit:contain}.addons-directory{grid-column:1;grid-row:2}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.addon-toggle{padding:0.72rem 0.75rem}.addon-panel{padding-left:0.75rem;padding-right:0.75rem}}

</head>
<body>
<div id="syndicate-menu"></div>
<div id="syndicate-subheader" data-section="resources" data-title="Add-ons"></div>
<main class="addons-page">
  <section class="addons-intro" aria-labelledby="addons-title">
    <h1 id="addons-title">ADD-ONS</h1>
    <p>Add-ons can make Classic Era easier to organize, understand, and survive. Browse tools used by Syndicate members for raiding, professions, guild management, inventory, PvP, and everyday gameplay.</p>
    <a class="syndicate-button" href="https://www.curseforge.com/wow" target="_blank" rel="noopener noreferrer">Visit CurseForge ↗</a>
  </section>
  <div class="addons-layout">
    <section class="addons-directory" aria-label="Add-on directory">
      <div class="filters">
        <input id="addonSearch" type="search" placeholder="Search add-ons..." aria-label="Search add-ons">
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All Categories</option><option value="guild">Guild &amp; Organization</option><option value="raid">Raiding &amp; Combat</option><option value="gear">Gear &amp; Character</option><option value="economy">Bags, Alts &amp; Economy</option><option value="gathering">Gathering &amp; Professions</option><option value="pvp">PvP</option>
        </select>
        <select id="statusFilter" aria-label="Filter by recommendation">
          <option value="all">All Add-ons</option><option value="required">Raid Required</option><option value="recommended">Recommended</option><option value="guild-tool">Guild Tool</option><option value="pvp">PvP</option>
        </select>
      </div>
      <div class="addon-tools"><span id="addonCount" role="status" aria-live="polite"></span><button type="button" id="toggleAll">Expand All</button></div>
      <div class="addon-list" id="addonList"></div>
      <p class="no-results" id="noResults" role="status">No add-ons match your search and filters.</p>
    </section>
    <aside class="addons-image" aria-label="Syndicate add-on artwork">
      <picture><source media="(max-width: 768px)" srcset="../images/addons2.png"><img src="../images/addons.png" alt="The Syndicate add-on resources" loading="lazy"></picture>
    </aside>
  </div>
</main>
<div id="syndicate-footer"></div>
<script>
(async function () {
  'use strict';
  const list=document.getElementById('addonList');
  const search=document.getElementById('addonSearch');
  const category=document.getElementById('categoryFilter');
  const status=document.getElementById('statusFilter');
  const count=document.getElementById('addonCount');
  const noResults=document.getElementById('noResults');
  const toggleAll=document.getElementById('toggleAll');
  const rows=[];
  const visible=()=>rows.filter(row=>!row.hidden);
  const labelForStatus={required:'Raid Required',recommended:'Recommended','guild-tool':'Guild Tool',pvp:'PvP'};
  function setOpen(row,open){
    const btn=row.querySelector('.addon-toggle');
    btn.setAttribute('aria-expanded',String(open));
    row.querySelector('.addon-panel').hidden=!open;
  }
  function filter(){
    const term=search.value.trim().toLowerCase();
    for (const row of rows) {
      const match=row.dataset.search.includes(term) && (category.value==='all'||row.dataset.category===category.value) && (status.value==='all'||row.dataset.status===status.value);
      row.hidden=!match;
      if(!match)setOpen(row,false);
    }
    const shown=visible();
    count.textContent=`Showing ${shown.length} of ${rows.length} add-ons`;
    noResults.style.display=shown.length?'none':'block';
    updateToggleAll();
  }
  function updateToggleAll(){
    const shown=visible();
    toggleAll.textContent=shown.length && shown.every(r=>r.querySelector('.addon-toggle').getAttribute('aria-expanded')==='true')?'Collapse All':'Expand All';
    toggleAll.disabled=!shown.length;
  }
  function render(item,i){
    const row=document.createElement('article');row.className='addon-entry';
    row.dataset.category=item.category;row.dataset.status=item.directory_status;
    row.dataset.search=[item.name,item.description,item.search_terms,item.category_label].join(' ').toLowerCase();
    const heading=document.createElement('h2');heading.className='addon-heading';
    const button=document.createElement('button');button.className='addon-toggle';button.type='button';button.id='addon-button-'+i;button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls','addon-panel-'+i);
    const label=document.createElement('span');label.className='addon-label';
    const name=document.createElement('span');name.className='addon-name';name.textContent=item.name;
    const meta=document.createElement('span');meta.className='addon-meta';
    const cat=document.createElement('span');cat.className='addon-category';cat.textContent=item.category_label;
    const tag=document.createElement('span');tag.className='tag '+({required:'required','guild-tool':'guild',pvp:'pvp'}[item.directory_status]||'');tag.textContent=labelForStatus[item.directory_status]||'Recommended';
    meta.append(cat,tag);label.append(name,meta);
    const chevron=document.createElement('span');chevron.className='addon-chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';
    button.append(label,chevron);heading.append(button);
    const panel=document.createElement('div');panel.className='addon-panel';panel.id='addon-panel-'+i;panel.setAttribute('role','region');panel.setAttribute('aria-labelledby',button.id);panel.hidden=true;
    const p=document.createElement('p');p.textContent=item.description;
    panel.append(p);
    if (item.url && /^https:\/\//i.test(item.url)) {
      const a=document.createElement('a');a.className='syndicate-button';a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View add-on ↗';panel.append(a);
    }
    row.append(heading,panel);
    button.addEventListener('click',()=>{setOpen(row,button.getAttribute('aria-expanded')!=='true');updateToggleAll()});
    rows.push(row);list.append(row);
  }
  toggleAll.addEventListener('click',()=>{
    const shown=visible();const expand=!shown.every(r=>r.querySelector('.addon-toggle').getAttribute('aria-expanded')==='true');
    shown.forEach(r=>setOpen(r,expand));updateToggleAll();
  });
  [search,category,status].forEach(control=>control.addEventListener(control===search?'input':'change',filter));
  count.textContent='Loading add-ons…';
  try {
    if(!window.SyndicateAddons)throw new Error('Shared addon-data.js could not load.');
    const records=await window.SyndicateAddons.getAddons();records.forEach(render);filter();
  } catch(error) {
    count.textContent='Unable to load add-ons: '+error.message;
    toggleAll.disabled=true;
  }
})();
</script>
</body>
</html>
