<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Syndicate | Coming Soon</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {
      --background-dark: #090909;
      --background-soft: #101010;

      --gold: #d9b438;
      --gold-light: #efcc54;
      --gold-dark: #7d651c;

      --text-light: #e6dfc9;
      --text-muted: #a59b80;

      --border: rgba(217, 180, 56, 0.35);

      --font-heading: "Cinzel", serif;
      --font-body: "Montserrat", sans-serif;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      background: var(--background-dark);
      color: var(--text-light);

      font-family: var(--font-body);

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       HEADER
    ========================= */

    .site-header {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--background-dark);

      border-bottom: 1px solid var(--gold-dark);

      position: relative;
      z-index: 100;
    }


    .logo-area {
      height: 70px;

      display: flex;
      align-items: center;

      padding-left: 14px;
    }


    .logo-area img {
      height: 46px;
      width: auto;

      display: block;
    }


    .desktop-nav {
      display: flex;
      align-items: center;

      gap: 34px;

      padding-right: 32px;

      font-family: var(--font-heading);

      font-size: 15px;

      color: var(--gold);
    }


    .desktop-nav a {
      transition: color 0.2s ease;
    }


    .desktop-nav a:hover {
      color: var(--gold-light);
    }


    .menu-button {
      display: none;

      background: none;
      border: none;

      color: var(--gold);

      font-size: 28px;

      cursor: pointer;

      padding: 12px 20px;
    }


    .mobile-nav {
      display: none;

      position: absolute;

      top: 70px;
      right: 0;

      width: 230px;

      background: #0b0b0b;

      border-left: 1px solid var(--gold-dark);
      border-bottom: 1px solid var(--gold-dark);

      z-index: 200;
    }


    .mobile-nav.open {
      display: block;
    }


    .mobile-nav a {
      display: block;

      padding: 15px 20px;

      border-bottom:
        1px solid rgba(217, 180, 56, 0.15);

      font-family: var(--font-heading);

      color: var(--gold);

      font-size: 14px;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 30px;
    }


    .coming-soon {
      width: 100%;
      max-width: 850px;

      text-align: center;

      padding: 60px 30px;

      border-top: 1px solid var(--gold-dark);
      border-bottom: 1px solid var(--gold-dark);
    }


    .coming-soon h1 {
      font-family: var(--font-heading);

      color: var(--gold);

      font-size: clamp(38px, 7vw, 72px);

      font-weight: 400;

      letter-spacing: 4px;

      margin-bottom: 18px;
    }


    .coming-soon p {
      color: var(--text-muted);

      font-size: 15px;

      line-height: 1.8;

      max-width: 600px;

      margin: 0 auto;
    }


    .coming-soon-mark {
      color: var(--gold-dark);

      font-size: 24px;

      margin-bottom: 18px;

      letter-spacing: 8px;
    }


    /* =========================
       FOOTER
    ========================= */

    .site-footer {
      border-top:
        1px solid rgba(217, 180, 56, 0.25);

      padding: 26px 30px 20px;

      text-align: center;
    }


    .footer-motto {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      font-family: var(--font-heading);

      font-size: 14px;

      letter-spacing: 3px;

      color: var(--gold-dark);
    }


    .footer-motto::before,
    .footer-motto::after {
      content: "";

      width: 90px;
      height: 1px;

      background: var(--gold-dark);
    }


    .footer-divider {
      height: 1px;

      max-width: 1100px;

      margin: 16px auto;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold-dark),
          transparent
        );
    }


    .footer-logo img {
      width: 155px;
      max-width: 65%;

      height: auto;
    }


    /* =========================
       TABLET / MOBILE
    ========================= */

    @media (max-width: 900px) {

      .desktop-nav {
        display: none;
      }

      .menu-button {
        display: block;
      }

    }


    @media (max-width: 650px) {

      .site-header {
        height: 60px;
      }


      .logo-area {
        height: 60px;
      }


      .logo-area img {
        height: 38px;
      }


      .mobile-nav {
        top: 60px;
      }


      main {
        padding: 40px 18px;
      }


      .coming-soon {
        padding: 45px 16px;
      }


      .coming-soon h1 {
        font-size: 38px;

        letter-spacing: 2px;
      }


      .coming-soon p {
        font-size: 13px;
      }


      .footer-motto {
        font-size: 11px;
        letter-spacing: 2px;
      }


      .footer-motto::before,
      .footer-motto::after {
        width: 45px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <a
      href="index.html"
      class="logo-area"
    >
      <img
        src="HeaderLogo.png"
        alt="The Syndicate"
      >
    </a>


    <nav class="desktop-nav">

      <a href="index.html">
        Home
      </a>

      <a href="officers.html">
        Our Guild
      </a>

      <a href="calendar.html">
        Calendar
      </a>

      <a href="raids.html">
        Raid Hub
      </a>

      <a href="resources.html">
        Resources
      </a>

    </nav>


    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <nav
      class="mobile-nav"
      id="mobileNav"
    >

      <a href="index.html">
        Home
      </a>

      <a href="officers.html">
        Our Guild
      </a>

      <a href="calendar.html">
        Calendar
      </a>

      <a href="raids.html">
        Raid Hub
      </a>

      <a href="resources.html">
        Resources
      </a>

    </nav>

  </header>


  <!-- =========================
       COMING SOON
  ========================== -->

  <main>

    <section class="coming-soon">

      <div class="coming-soon-mark">
        ✦ ✦ ✦
      </div>

      <h1>
        Coming Soon
      </h1>

      <p>
        This section of The Syndicate is still being built.
        Check back soon for more information, resources,
        and questionable levels of organization.
      </p>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="footer-motto">
      ✦ THIS IS THE WAY. ✦
    </div>

    <div class="footer-divider"></div>

    <div class="footer-logo">

      <img
        src="HeaderLogo.png"
        alt="The Syndicate"
      >

    </div>

  </footer>


  <!-- =========================
       MOBILE MENU
  ========================== -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const mobileNav =
      document.getElementById("mobileNav");


    menuButton.addEventListener(
      "click",
      function () {

        const isOpen =
          mobileNav.classList.toggle("open");

        menuButton.setAttribute(
          "aria-expanded",
          isOpen
        );

      }
    );

  </script>


</body>
</html>
