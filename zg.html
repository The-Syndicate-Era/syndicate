<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zul'Gurub | The Syndicate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --background: #080806;
      --background-dark: #050504;
      --panel: #11100d;
      --panel-hover: #16140f;

      --gold: #d9b438;
      --gold-dark: #6c5520;
      --gold-soft: #b89a42;

      --text: #d8d2c4;
      --text-muted: #a79e8d;

      --red-top: #b51414;
      --red-mid: #8f0909;
      --red-bottom: #650505;

      /* ZG RAID ACCENT */
      --raid: #4f7d3a;
      --raid-dark: #263d1d;
      --raid-soft: #82a96c;

      --missing: #e07b5f;

      --font-heading: "Cinzel", serif;
      --font-body: "Montserrat", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(
          circle at top,
          rgba(79,125,58,.08),
          transparent 32%
        ),
        var(--background);

      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .site-header {
      height: 70px;

      background: var(--background-dark);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 30px;

      border-bottom: 1px solid var(--gold-dark);

      position: relative;
      z-index: 100;
    }

    .logo-area img {
      height: 45px;
      width: auto;
      display: block;
    }

    .menu-button {
      background: none;
      border: none;

      color: var(--gold);
      font-size: 30px;

      cursor: pointer;
    }

    /* =====================================================
       SIDE MENU
       ===================================================== */

    .menu-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.7);

      opacity: 0;
      visibility: hidden;

      transition: .25s ease;

      z-index: 999;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .side-menu {
      position: fixed;

      top: 0;
      right: -440px;

      width: 420px;
      max-width: 48vw;
      height: 100vh;

      background: #0b0a08;

      border-left: 1px solid var(--gold-dark);

      padding: 38px 34px;

      transition: right .3s ease;

      z-index: 1000;

      display: flex;
      flex-direction: column;
    }

    .side-menu.open {
      right: 0;
    }

    .close-menu {
      align-self: flex-end;

      background: none;
      border: none;

      color: var(--gold);
      font-size: 34px;

      cursor: pointer;

      margin-bottom: 20px;
    }

    .side-menu-logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .side-menu-logo img {
      width: 180px;
      max-width: 100%;
    }

    .side-menu-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-menu-links a {
      color: var(--gold);

      text-decoration: none;

      font-family: var(--font-heading);
      letter-spacing: 1px;
      font-size: 18px;

      padding: 13px 4px;

      border-bottom:
        1px solid rgba(108,85,32,.55);
    }

    .side-menu-links a:hover {
      color: #f2d565;
    }

    .side-menu-motto {
      margin-top: auto;

      text-align: center;

      color: var(--gold-dark);

      font-family: var(--font-heading);
      font-size: 13px;
      letter-spacing: 2px;

      padding-top: 25px;
    }

    /* =====================================================
       HERO
       ===================================================== */

    .raid-hero {
      max-width: 1200px;

      margin: 0 auto;

      padding: 52px 40px 34px;

      display: grid;

      grid-template-columns: .95fr 1.05fr;

      gap: 44px;

      align-items: center;
    }

    .raid-image {
      height: 330px;

      background: #0c0b09;

      border: 1px solid var(--raid-dark);

      padding: 10px;

      box-shadow:
        0 14px 35px rgba(0,0,0,.5),
        0 0 18px rgba(79,125,58,.08);
    }

    .raid-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .raid-copy h1 {
      color: var(--gold);

      font-family: var(--font-heading);

      font-size:
        clamp(42px,5vw,66px);

      font-weight: 400;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }

    .raid-line {
      width: 130px;
      height: 2px;

      background: var(--raid);

      margin-bottom: 18px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 20px;
    }

    .status {
      display: inline-block;

      padding: 6px 10px;

      border: 1px solid var(--raid);

      color: var(--raid-soft);

      background: rgba(79,125,58,.08);

      font-family: var(--font-heading);

      font-size: 10px;

      letter-spacing: 1px;
    }

    .raid-copy p {
      max-width: 630px;

      color: #cbc4b5;

      font-size: 14px;
      line-height: 1.75;
    }

    /* =====================================================
       QUICK FACTS
       ===================================================== */

    .quick-facts-wrap {
      max-width: 1200px;

      margin: 0 auto;

      padding: 0 40px 28px;
    }

    .quick-facts {
      display: grid;

      grid-template-columns:
        repeat(5,1fr);

      border: 1px solid #3d351f;

      background: #0d0c09;
    }

    .quick-fact {
      padding: 17px 18px;

      border-right: 1px solid #332c1b;
    }

    .quick-fact:last-child {
      border-right: none;
    }

    .quick-fact strong {
      display: block;

      color: var(--raid-soft);

      font-family: var(--font-heading);

      font-size: 10px;

      letter-spacing: .8px;

      margin-bottom: 5px;
    }

    .quick-fact span {
      color: var(--text);

      font-size: 12px;
    }

    /* =====================================================
       TABS
       ===================================================== */

    .raid-content {
      max-width: 1200px;

      margin: 0 auto;

      padding: 0 40px 80px;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;

      border-bottom: 1px solid var(--gold-dark);

      margin-bottom: 26px;
    }

    .tab-button {
      padding: 14px 17px;

      background: transparent;

      border: none;
      border-bottom: 3px solid transparent;

      color: var(--text-muted);

      font-family: var(--font-heading);

      font-size: 11px;

      letter-spacing: .7px;

      cursor: pointer;
    }

    .tab-button:hover {
      color: var(--gold);
    }

    .tab-button.active {
      color: var(--gold);

      border-bottom-color: var(--raid);

      background:
        linear-gradient(
          to top,
          rgba(79,125,58,.08),
          transparent
        );
    }

    /* =====================================================
       TAB PANELS
       ===================================================== */

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .content-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 20px;
    }

    .content-box {
      background: var(--panel);

      border: 1px solid #39311e;

      padding: 24px;
    }

    .content-box.full {
      grid-column:
        1 / -1;
    }

    .content-box h2,
    .content-box h3 {
      color: var(--gold);

      font-family: var(--font-heading);

      font-weight: 500;

      margin-bottom: 15px;
    }

    .content-box h2 {
      font-size: 22px;
    }

    .content-box h3 {
      font-size: 15px;
    }

    .content-box p {
      color: #c9c2b3;

      font-size: 13px;
      line-height: 1.75;
    }

    .content-box ul,
    .content-box ol {
      padding-left: 20px;
    }

    .content-box li {
      color: #c9c2b3;

      font-size: 13px;
      line-height: 1.7;

      margin-bottom: 7px;
    }

    /* =====================================================
       BOSS LIST
       ===================================================== */

    .boss-list {
      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 12px;
    }

    .boss {
      padding: 17px;

      background: #0c0b09;

      border-left: 3px solid var(--raid-dark);
    }

    .boss strong {
      display: block;

      color: var(--gold);

      font-family: var(--font-heading);

      font-size: 13px;

      margin-bottom: 6px;
    }

    .boss span {
      color: var(--text-muted);

      font-size: 12px;
      line-height: 1.55;
    }

    .boss.optional {
      border-left-color: var(--gold-dark);
    }

    /* =====================================================
       TAGS
       ===================================================== */

    .tag-list {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .tag {
      padding: 5px 8px;

      background: #090806;

      border: 1px solid var(--raid-dark);

      color: var(--raid-soft);

      font-size: 9px;

      letter-spacing: .7px;

      text-transform: uppercase;
    }

    .tag.gold {
      color: var(--gold);
      border-color: var(--gold-dark);
    }

    /* =====================================================
       BUTTONS
       ===================================================== */

    .button-row {
      display: flex;
      flex-wrap: wrap;

      gap: 14px;

      margin-top: 20px;
    }

    .syndicate-button {
      min-height: 42px;

      padding: 10px 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          to bottom,
          var(--red-top) 0%,
          var(--red-mid) 45%,
          var(--red-bottom) 100%
        );

      color: #ffd633;

      font-family: var(--font-heading);

      font-size: 11px;

      letter-spacing: .7px;

      text-decoration: none;
      text-align: center;

      border: 2px solid #2a1a10;
      border-radius: 5px;

      box-shadow:
        0 0 0 2px #6a4a25,
        0 0 0 4px #120d09,
        inset 0 2px 0 rgba(255,255,255,.14),
        inset 0 -2px 0 rgba(0,0,0,.55),
        0 3px 5px rgba(0,0,0,.65);

      text-shadow: 1px 1px 2px #000;
    }

    .syndicate-button:hover {
      filter: brightness(1.12);
    }

    /* =====================================================
       MAP PLACEHOLDER
       ===================================================== */

    .map-placeholder {
      min-height: 320px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      border: 1px dashed var(--raid-dark);

      background:
        radial-gradient(
          circle,
          rgba(79,125,58,.08),
          transparent 55%
        ),
        #0b0a08;

      color: var(--text-muted);

      font-size: 13px;

      padding: 30px;
    }

    /* =====================================================
       MISSING
       ===================================================== */

    .missing-info {
      color: var(--missing) !important;

      font-weight: 600;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .site-footer {
      border-top: 1px solid var(--gold-dark);

      text-align: center;

      padding: 45px 20px;

      background: #060605;
    }

    .footer-motto {
      color: var(--gold);

      font-family: var(--font-heading);

      font-size: 14px;

      letter-spacing: 2px;

      margin-bottom: 20px;
    }

    .site-footer img {
      width: 145px;
      max-width: 70%;

      opacity: .85;
    }

    /* =====================================================
       TABLET
       ===================================================== */

    @media(max-width:950px) {

      .raid-hero {
        grid-template-columns: 1fr;
      }

      .quick-facts {
        grid-template-columns:
          repeat(2,1fr);
      }

      .quick-fact {
        border-bottom:
          1px solid #332c1b;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .content-box.full {
        grid-column: auto;
      }

    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media(max-width:650px) {

      .site-header {
        padding: 0
